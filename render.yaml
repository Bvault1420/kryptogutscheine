services:
  - type: web
    name: kryptogutscheine
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BITREFILL_API_BASE_URL
        value: https://api-bitrefill.com/v2
      - key: BITREFILL_INCLUDE_TEST_PRODUCTS
        value: "true"
      - key: BITREFILL_API_KEY
        sync: false
      - key: BITREFILL_WEBHOOK_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
