<!DOCTYPE html>
<html lang="de">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('Kryptogutscheine-theme') || localStorage.getItem('redeemx-theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kryptogutscheine – Digitale Gutscheine mit Kryptowährung kaufen. Vermittlung über Bitrefill. Keine Finanzdienstleistung, keine Gelderverwahrung." />
    <meta name="theme-color" content="#0d9488" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Kryptogutscheine – Digitale Gutscheine mit Krypto</title>
  </head>
  <body class="bg-surface text-content antialiased transition-colors duration-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
